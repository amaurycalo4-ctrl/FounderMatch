<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Login – FounderMatch</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

<header>
  <nav class="navbar">

    <a href="index.html" class="logo">
      Founder<span>Match</span>
    </a>

  </nav>
</header>

<main class="matches-page">

  <section class="matches-intro">

    <div class="section-label">
      WELCOME BACK
    </div>

    <h1>Log in to FounderMatch.</h1>

    <p>
      Enter the email address linked to your FounderMatch profile.
    </p>

  </section>

  <section class="match-card">

    <form id="loginForm">

      <label for="email">
        Email
      </label>

      <input
        type="email"
        id="email"
        name="email"
        placeholder="you@example.com"
        required
      >
      <label for="password">
  Password
</label>

<input
  type="password"
  id="password"
  name="password"
  placeholder="Your password"
  autocomplete="current-password"
  required
>

      <button
        type="submit"
        class="match-button match-button-primary">
        Continue →
      </button>

      <p id="loginMessage"></p>

    </form>

  </section>

</main>

<footer>

  <div class="footer-logo">
    Founder<span>Match</span>
  </div>

  <p>
    An independent student entrepreneurship experiment.
  </p>

</footer>
<script>
const API_URL =
  "https://foundermatch-api.amaurycalo4.workers.dev";

const loginForm =
  document.getElementById("loginForm");

const loginMessage =
  document.getElementById("loginMessage");

loginForm.addEventListener("submit", async function(event) {
  event.preventDefault();

  const email =
    document.getElementById("email").value.trim();

  const password =
    document.getElementById("password").value;

  loginMessage.textContent = "Logging in...";

  try {
    const response = await fetch(`${API_URL}/api/login`, {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({
        email: email,
        password: password
      })
    });

    const data = await response.json();

    if (!response.ok || !data.success) {
      loginMessage.textContent =
        data.error || "Unable to log in.";
      return;
    }

    localStorage.setItem(
      "foundermatch_profile_id",
      String(data.profile_id)
    );

    localStorage.setItem(
      "foundermatch_session_token",
      data.token
    );

    window.location.href =
      `matches.html?profile_id=${data.profile_id}`;

  } catch (error) {
    console.error(error);

    loginMessage.textContent =
      "Unable to log in. Please try again.";
  }
});
</script>
</body>
</html>
