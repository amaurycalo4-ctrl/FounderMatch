<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Login – FounderMatch</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

<header>
  <nav class="navbar">

    <a href="index.html" class="logo">
      Founder<span>Match</span>
    </a>

  </nav>
</header>

<main class="matches-page">

  <section class="matches-intro">

    <div class="section-label">
      WELCOME BACK
    </div>

    <h1>Log in to FounderMatch.</h1>

    <p>
      Enter the email address linked to your FounderMatch profile.
    </p>

  </section>

  <section class="match-card">

    <form id="loginForm">

      <label for="email">
        Email
      </label>

      <input
        type="email"
        id="email"
        name="email"
        placeholder="you@example.com"
        required
      >

      <button
        type="submit"
        class="match-button match-button-primary">
        Continue →
      </button>

      <p id="loginMessage"></p>

    </form>

  </section>

</main>

<footer>

  <div class="footer-logo">
    Founder<span>Match</span>
  </div>

  <p>
    An independent student entrepreneurship experiment.
  </p>

</footer>

</body>
</html>
